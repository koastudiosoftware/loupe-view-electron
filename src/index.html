<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111318" />
    <title>Loupe View</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        min-width: 320px;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #111318;
        color: #f3f4f6;
        font-family: "Segoe UI", sans-serif;
      }

      #screen-host {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
      }

      #single-image-view,
      #directory-view {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
      }

      #single-image-view[hidden],
      #directory-view[hidden],
      settings-screen[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <app-title-bar>
      <span slot="branding">Loupe View</span>
    </app-title-bar>
    <div id="screen-host">
      <div id="single-image-view" data-screen="single-image-view" hidden>
        <single-image-view-screen></single-image-view-screen>
        <image-status-bar></image-status-bar>
      </div>
      <directory-view-screen
        id="directory-view"
        data-screen="directory-view"
      ></directory-view-screen>
      <settings-screen class="themed-scrollbar" data-screen="settings" hidden></settings-screen>
    </div>
    <script type="module" src="./ui/app.js"></script>
  </body>
</html>
